{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="bi bi-person-circle me-2"></i>Mi Perfil</h3>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3 text-center">
                    <div class="bg-light rounded-circle p-4 mb-3 mx-auto" style="width: 150px; height: 150px;">
                        <i class="bi bi-person" style="font-size: 5rem; color: #6c757d;"></i>
                    </div>
                    <h4>{{ user['nombre_completo'] }}</h4>
                    <span class="badge bg-info">{{ user['rol']|capitalize }}</span>
                </div>
                
                <div class="col-md-9">
                    <div class="mb-4">
                        <h5>Información de la Cuenta</h5>
                        <hr>
                        <div class="row">
                            <div class="col-md-6">
                                <p><strong><i class="bi bi-person-badge me-2"></i>Usuario:</strong> {{ user['username'] }}</p>
                                <p><strong><i class="bi bi-envelope me-2"></i>Email:</strong> {{ user['email'] }}</p>
                            </div>
                            <div class="col-md-6">
                                <p><strong><i class="bi bi-calendar me-2"></i>Cuenta creada:</strong> {{ user['creado'] }}</p>
                                <p><strong><i class="bi bi-shield-lock me-2"></i>Rol:</strong> {{ user['rol']|capitalize }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
