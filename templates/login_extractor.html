<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Extractor de Plantillas — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family:'Inter',sans-serif; background:linear-gradient(135deg,#1e3a5f,#2d5080); min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-card { background:#fff; border-radius:16px; padding:40px 48px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
        .login-icon { font-size:2.5rem; color:#2e86de; }
        .form-control { border-radius:8px; padding:.6rem 1rem; }
        .form-control:focus { border-color:#2e86de; box-shadow:0 0 0 3px rgba(46,134,222,.15); }
        .btn-login { background:#2e86de; border:none; border-radius:8px; padding:.65rem; font-weight:600; width:100%; }
        .btn-login:hover { background:#1a6bbf; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-file-earmark-text-fill login-icon"></i>
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
            <h4 class="fw-bold mt-2 mb-0" style="color:#1e3a5f;">Extractor de Plantillas</h4>
            <p class="text-muted small">Extracción inteligente de documentos PDF</p>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="alert alert-danger py-2 small mb-3">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-muted">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="usuario" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small text-muted">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login text-white">Ingresar</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
